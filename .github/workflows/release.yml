name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        shell: bash
        run: |
          source version.env
          test "$GITHUB_REF_NAME" = "v$MARKETING_VERSION"
          test "$MARKETING_VERSION" = '1.0.0'
          test "$BUILD_NUMBER" = '1'
      - name: Test
        run: swift test
      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/saferun-signing.keychain-db"
          P12="$RUNNER_TEMP/saferun-certificate.p12"
          trap 'rm -f "$P12"' EXIT
          printf '%s' "$CERTIFICATE" | base64 -D > "$P12"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          test -n "$APP_IDENTITY"
          echo "APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
      - name: Build, notarize, and verify release DMG
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export APPLE_API_KEY_PATH="$KEY_PATH"
          Scripts/build_release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/SafeRun-1.0.0/SafeRun-1.0.0.dmg \
            dist/SafeRun-1.0.0/SafeRun-1.0.0.dmg.sha256 \
            --title "SafeRun 1.0.0" \
            --notes-file CHANGELOG.md
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/saferun-signing.keychain-db" || true

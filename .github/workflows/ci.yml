name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Strict release build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Tests
        run: swift test
